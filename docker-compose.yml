services:
  flexipack:
    build: .
    image: ghcr.io/rolfwalker71-commits/aipacklist:latest
    container_name: flexipack
    ports:
      - "3330:3330"
    volumes:
      - flexipack-data:/app/data
    environment:
      DATABASE_URL: file:/app/data/flexipack.db
      NODE_ENV: production
      PORT: "3330"
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3330/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  flexipack-data:
