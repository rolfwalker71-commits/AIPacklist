<!DOCTYPE html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a1413" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>FlexiPack</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
    />
    <style>
      /* Liquid Glass — standalone copy of the app tokens so this page
         stays free of the bundle (it must load before any JS). */
      :root {
        color-scheme: light;
        --fg: #14201f;
        --fg-muted: #5c6d6b;
        --fg-subtle: #7b8c8a;
        --glass-thin: rgba(255, 255, 255, 0.46);
        --glass-regular: rgba(255, 255, 255, 0.62);
        --rim-top: rgba(255, 255, 255, 0.92);
        --rim-bottom: rgba(255, 255, 255, 0.35);
        --edge: rgba(20, 32, 31, 0.1);
        --edge-strong: rgba(20, 32, 31, 0.16);
        --sheen: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.55) 0%,
          rgba(255, 255, 255, 0.12) 26%,
          rgba(255, 255, 255, 0) 52%
        );
        --lift-3: 0 6px 16px rgba(11, 61, 57, 0.1),
          0 20px 56px rgba(11, 61, 57, 0.16);
        --teal-600: #0d9488;
        --teal-800: #0f5d57;
        --danger: #be123c;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --fg: #eef4f3;
          --fg-muted: #a6b8b6;
          --fg-subtle: #7f9290;
          --glass-thin: rgba(126, 160, 158, 0.15);
          --glass-regular: rgba(120, 152, 150, 0.2);
          --rim-top: rgba(255, 255, 255, 0.24);
          --rim-bottom: rgba(255, 255, 255, 0.06);
          --edge: rgba(255, 255, 255, 0.1);
          --edge-strong: rgba(255, 255, 255, 0.18);
          --sheen: linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.16) 0%,
            rgba(255, 255, 255, 0.04) 28%,
            rgba(255, 255, 255, 0) 54%
          );
          --lift-3: 0 8px 20px rgba(0, 0, 0, 0.45), 0 24px 60px rgba(0, 0, 0, 0.55);
          --danger: #f43f5e;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: Outfit, -apple-system, "SF Pro Text", system-ui,
          "Segoe UI", Helvetica, Arial, sans-serif;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        background: radial-gradient(
              95% 65% at 6% -8%,
              rgba(45, 212, 191, 0.34) 0%,
              transparent 58%
            ),
            radial-gradient(
              80% 55% at 102% 6%,
              rgba(251, 191, 36, 0.3) 0%,
              transparent 60%
            ),
            radial-gradient(
              90% 65% at 55% 112%,
              rgba(56, 189, 248, 0.24) 0%,
              transparent 62%
            ),
            linear-gradient(168deg, #fffdf8 0%, #f2f8f5 46%, #f7f3ec 100%);
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: radial-gradient(
                95% 65% at 6% -8%,
                rgba(13, 148, 136, 0.42) 0%,
                transparent 58%
              ),
              radial-gradient(
                80% 55% at 102% 6%,
                rgba(180, 83, 9, 0.34) 0%,
                transparent 60%
              ),
              radial-gradient(
                90% 65% at 55% 112%,
                rgba(14, 116, 144, 0.38) 0%,
                transparent 62%
              ),
              linear-gradient(168deg, #06100f 0%, #0a1918 46%, #0a1412 100%);
        }
      }

      .card {
        position: relative;
        isolation: isolate;
        width: 100%;
        max-width: 26rem;
        border-radius: 30px;
        padding: 1.75rem;
        background: var(--glass-regular);
        backdrop-filter: blur(30px) saturate(185%);
        -webkit-backdrop-filter: blur(30px) saturate(185%);
        box-shadow: inset 0 1px 0 0 var(--rim-top),
          inset 0 -1px 0 0 var(--rim-bottom), inset 0 0 0 1px var(--edge),
          var(--lift-3);
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: inherit;
        pointer-events: none;
        background: var(--sheen);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 0 0 1.25rem;
      }

      .brand img {
        width: 2.5rem;
        height: 2.5rem;
      }

      .eyebrow {
        margin: 0;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--teal-600);
      }

      h1 {
        margin: 0;
        font-size: 1.85rem;
        letter-spacing: -0.035em;
        line-height: 1.1;
        font-weight: 600;
      }

      .sub {
        margin: 0.5rem 0 0;
        color: var(--fg-muted);
        font-size: 1rem;
      }

      label {
        display: block;
        margin: 1.1rem 0 0.4rem;
        font-size: 0.88rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--fg-muted);
      }

      input {
        width: 100%;
        height: 3rem;
        border: 0;
        border-radius: 16px;
        padding: 0 0.9rem;
        font: inherit;
        font-size: 1rem;
        color: var(--fg);
        background: var(--glass-thin);
        backdrop-filter: blur(20px) saturate(185%);
        -webkit-backdrop-filter: blur(20px) saturate(185%);
        box-shadow: inset 0 1px 0 var(--rim-top), inset 0 0 0 1px var(--edge);
      }

      input:focus-visible {
        outline: 2px solid var(--teal-600);
        outline-offset: 1px;
      }

      button {
        margin-top: 1.4rem;
        width: 100%;
        height: 3rem;
        border: 0;
        border-radius: 999px;
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(160deg, var(--teal-600), var(--teal-800));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42),
          inset 0 -1px 0 rgba(0, 0, 0, 0.12), 0 4px 14px rgba(15, 118, 110, 0.32);
        transition: transform 150ms cubic-bezier(0.2, 0.9, 0.3, 1);
      }

      button:active {
        transform: scale(0.97);
      }

      .err {
        margin-top: 0.9rem;
        color: var(--danger);
        font-size: 0.9rem;
        font-weight: 600;
      }

      .hint {
        margin-top: 0.8rem;
        font-size: 0.8rem;
        color: var(--fg-subtle);
      }

      .loading {
        color: var(--fg-subtle);
        font-size: 0.9rem;
      }

      /* Reduced transparency / no backdrop-filter: opaque surfaces. */
      @media (prefers-reduced-transparency: reduce) {
        .card,
        input {
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
          background: #fff;
        }
        .card::before {
          display: none;
        }
      }

      @supports not (
        (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))
      ) {
        .card {
          background: rgba(255, 255, 255, 0.96);
        }
        input {
          background: rgba(255, 255, 255, 0.94);
        }
      }

      @media (prefers-reduced-transparency: reduce) and (prefers-color-scheme: dark) {
        .card,
        input {
          background: #16211f;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <img src="/logo.svg" alt="FlexiPack" width="40" height="40" />
        <p class="eyebrow">FlexiPack</p>
      </div>
      <div id="root" class="loading">Laden…</div>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var next = params.get("next") || "/";
        if (!(next.charAt(0) === "/" && next.charAt(1) !== "/")) next = "/";
        var errMap = {
          missing: "Angaben unvollständig oder ungültig.",
          auth: "Anmeldung fehlgeschlagen.",
          server: "Serverfehler.",
        };
        var err = params.get("error");
        var errHtml = err
          ? '<p class="err">' + (errMap[err] || "Fehler") + "</p>"
          : "";

        function field(id, name, label, opts) {
          opts = opts || {};
          return (
            '<label for="' +
            id +
            '">' +
            label +
            "</label>" +
            '<input id="' +
            id +
            '" name="' +
            name +
            '"' +
            (opts.type ? ' type="' + opts.type + '"' : "") +
            (opts.autocomplete ? ' autocomplete="' + opts.autocomplete + '"' : "") +
            (opts.value ? ' value="' + opts.value + '"' : "") +
            (opts.placeholder ? ' placeholder="' + opts.placeholder + '"' : "") +
            (opts.minlength ? ' minlength="' + opts.minlength + '"' : "") +
            " required />"
          );
        }

        fetch("/api/auth/status")
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            var root = document.getElementById("root");
            if (d.needsSetup) {
              root.innerHTML =
                "<h1>Admin einrichten</h1>" +
                '<p class="sub">Frisch gestartet — lege den ersten Admin-Account an.</p>' +
                '<form method="POST" action="/api/auth/setup">' +
                '<input type="hidden" name="next" value="' +
                next +
                '" />' +
                field("name", "name", "Anzeigename", {
                  value: "Rolf",
                  autocomplete: "name",
                }) +
                field("username", "username", "Benutzername", {
                  value: "rolf",
                  autocomplete: "username",
                  placeholder: "nur a-z, 0-9",
                }) +
                field("password", "password", "Passwort", {
                  type: "password",
                  autocomplete: "new-password",
                  minlength: "8",
                }) +
                errHtml +
                '<button type="submit">Admin erstellen & starten</button>' +
                '<p class="hint">Benutzername später zum Login verwenden (z.B. rolf).</p>' +
                "</form>";
            } else {
              root.innerHTML =
                "<h1>Anmelden</h1>" +
                '<p class="sub">Mit Benutzername und Passwort.</p>' +
                '<form method="POST" action="/api/auth/login">' +
                '<input type="hidden" name="next" value="' +
                next +
                '" />' +
                field("username", "username", "Benutzername", {
                  autocomplete: "username",
                  placeholder: "z.B. rolf",
                }) +
                field("password", "password", "Passwort", {
                  type: "password",
                  autocomplete: "current-password",
                  minlength: "8",
                }) +
                errHtml +
                '<button type="submit">Anmelden</button>' +
                "</form>";
            }
          })
          .catch(function () {
            document.getElementById("root").innerHTML =
              '<p class="err">Server nicht erreichbar.</p>';
          });

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) {
              r.unregister();
            });
          });
        }
      })();
    </script>
  </body>
</html>
